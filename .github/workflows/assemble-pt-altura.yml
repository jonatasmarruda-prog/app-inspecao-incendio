name: Atualizar PT Trabalho em Altura

on:
  push:
    paths:
      - 'scripts/ptv2/**'
      - '.github/workflows/assemble-pt-altura.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar módulo PT detalhado
        run: |
          cat scripts/ptv2/part-*.txt > pt-altura.js
          node --check pt-altura.js

      - name: Atualizar versões de cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          loader = Path('sst-repair-loader.js')
          txt = loader.read_text(encoding='utf-8')
          txt = txt.replace("pt-altura.js?v=20260903-01", "pt-altura.js?v=20260903-02")
          loader.write_text(txt, encoding='utf-8')

          for name in ('service-worker.js','sw.js'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              m=re.search(r"inspecao-sst-v(\d+)", s)
              if not m:
                  continue
              old=int(m.group(1)); new=max(old+1,54)
              s=s.replace(f'inspecao-sst-v{old}', f'inspecao-sst-v{new}')
              s=s.replace(f"?v={old}", f"?v={new}")
              p.write_text(s, encoding='utf-8')
          PY
          node --check sst-repair-loader.js

      - name: Publicar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt-altura.js sst-repair-loader.js service-worker.js sw.js
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git commit -m "Amplia checklist da PT trabalho em altura"
          git push
