name: Verificar sintaxe SST
on:
  workflow_dispatch:
  push:
    paths:
      - 'AUDITORIA_TRIGGER.txt'
      - '.github/workflows/check-sst-syntax.yml'
      - '.github/scripts/audit_stabilize_20260904.py'
      - 'sst-modulos.js'
      - 'integracao-modulos.js'
      - 'sst-repair-loader.js'
      - 'accident-injury-module.js'
      - 'pdf-global-standard.js'
      - 'pdf-filename-global.js'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar estabilizacao da auditoria
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Executa estabilizacao da auditoria SST')
        run: python3 .github/scripts/audit_stabilize_20260904.py
      - name: Verificar JavaScript
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find api functions -type f -name '*.js' -print0 2>/dev/null | sort -z | xargs -0 -r -n1 node --check
          echo "SINTAXE_OK"
      - name: Commitar estabilizacao
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Executa estabilizacao da auditoria SST')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Estabiliza codigo apos auditoria geral SST"
          git push
