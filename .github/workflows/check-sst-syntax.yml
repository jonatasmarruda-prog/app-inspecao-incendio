name: Verificar sintaxe SST
on:
  workflow_dispatch:
  push:
    paths:
      - 'sst-modulos.js'
      - 'integracao-modulos.js'
      - 'sst-repair-loader.js'
      - 'accident-injury-module.js'
      - 'pdf-global-standard.js'
      - 'pdf-filename-global.js'
      - 'PDF_HEADER_FILENAME_TRIGGER.txt'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check sst-modulos.js
          node --check integracao-modulos.js
          node --check sst-repair-loader.js
          node --check accident-injury-module.js
          node --check pdf-global-standard.js
          node --check pdf-filename-global.js
          echo "SINTAXE_OK"
  patch-pdf-corporate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Dispara padronizacao global de PDF')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar cabecalho corporativo global
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('integracao-modulos.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='20260904-24-logo-pdf';","const VERSION='20260904-25-corporate-header';",1)
          pattern=r"  function ensureCorporatePdfLogo\(docDefinition\)\{.*?\n  \}\n\n  function enforce\(docDefinition\)\{"
          replacement="""  function ensureCorporatePdfLogo(docDefinition){
    if(!docDefinition||typeof docDefinition!=='object'||!Array.isArray(docDefinition.content))return docDefinition;
    const content=docDefinition.content;
    let logoIndex=content.findIndex(node=>node&&node.image===logoTBM);
    let logoNode;
    if(logoIndex>=0){
      logoNode=content.splice(logoIndex,1)[0];
      logoNode.image=logoTBM;
      logoNode.width=160;
      logoNode.alignment='center';
      logoNode.margin=[0,0,0,10];
    }else{
      logoNode={image:logoTBM,width:160,alignment:'center',margin:[0,0,0,10]};
    }
    const first=content[0];
    const body=first?.table?.body;
    const row=Array.isArray(body)&&Array.isArray(body[0])?body[0]:null;
    if(row&&row.length>=2){
      const legacy=row[0];
      const legacyText=String(legacy?.text||'').trim().toUpperCase();
      if(legacy&&typeof legacy==='object'&&(legacy.image||legacy.svg||legacyText==='TBM')){
        row.shift();
        if(Array.isArray(first.table.widths)&&first.table.widths.length)first.table.widths.shift();
      }
    }
    content.unshift(logoNode);
    return docDefinition;
  }

  function enforce(docDefinition){"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ensureCorporatePdfLogo não localizado')
          s=s2.replace("window.__tbmPremiumPdfStatusVersion='2026.09.04.2-global-logo-contrast';","window.__tbmPremiumPdfStatusVersion='2026.09.04.3-corporate-header-160';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('pdf-global-standard.js')
          s=p.read_text(encoding='utf-8')
          pattern=r"function dynamicPdfTitle\(docDefinition\)\{.*?\n\}"
          replacement="""function dynamicPdfTitle(docDefinition){
  const st=currentState();
  const type=String(st?.type||'').trim().toLowerCase();
  const texts=collectText(docDefinition?.content,[],90);
  const signal=norm([type,st?.title,docDefinition?.info?.title,docDefinition?.info?.subject,...texts].filter(Boolean).join(' | '));
  if(type==='nr24'||signal.includes('NR 24'))return'INSPEÇÃO DE SEGURANÇA DO TRABALHO - NR 24';
  if(type==='pt-altura'||signal.includes('TRABALHO EM ALTURA')||signal.includes('PERMISSAO DE TRABALHO'))return'PERMISSÃO DE TRABALHO EM ALTURA - PT';
  if(type==='training-attendance'||signal.includes('LISTA DE PRESENCA')||signal.includes('TREINAMENTO SST'))return'LISTA DE PRESENÇA - TREINAMENTO DE SST';
  if(type==='fire'||signal.includes('COMBATE A INCENDIO')||signal.includes('EXTINTOR')||signal.includes('HIDRANTE'))return'INSPEÇÃO DE EQUIPAMENTOS DE COMBATE A INCÊNDIO';
  if(type==='machine'||signal.includes('NR-12')||signal.includes('NR 12')||signal.includes('MAQUINAS E EQUIPAMENTOS'))return'INSPEÇÃO DE MÁQUINAS E EQUIPAMENTOS - NR 12';
  if(type==='epi'||signal.includes('INSPECAO DE EPI'))return'INSPEÇÃO DE EPI';
  if(type==='accident'||signal.includes('INVESTIGACAO DE ACIDENTE'))return'INVESTIGAÇÃO DE ACIDENTE';
  if(type==='report'||signal.includes('RELATORIO DE INSPECAO'))return'RELATÓRIO DE INSPEÇÃO';
  if(type==='safety'||type==='seg'||signal.includes('INSPECAO DE SEGURANCA'))return'INSPEÇÃO DE SEGURANÇA DO TRABALHO';
  return'INSPEÇÃO DE SEGURANÇA DO TRABALHO';
}"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dynamicPdfTitle não localizado')

          s=s.replace("    text.includes('INSPECAO DE MAQUINAS E EQUIPAMENTOS');","    text.includes('INSPECAO DE MAQUINAS E EQUIPAMENTOS')||\n    text==='INVESTIGACAO DE ACIDENTE'||\n    text==='INSPECAO DE EPI'||\n    text==='RELATORIO DE INSPECAO'||\n    text==='INSPECAO DE SEGURANCA DO TRABALHO';",1)

          pattern=r"function replaceMainTitle\(node,title\)\{.*?\n\}\nfunction applyDynamicTitle\(docDefinition\)\{.*?\n\}"
          replacement="""function stripMainTitles(node){
  if(!node||typeof node!=='object')return;
  if(Array.isArray(node)){
    for(let i=node.length-1;i>=0;i--){
      if(isMainTitleNode(node[i]))node.splice(i,1);
      else stripMainTitles(node[i]);
    }
    return;
  }
  for(const k of Object.keys(node)){
    if(typeof node[k]==='function'||k==='image'||k==='svg'||k==='qr'||k==='canvas')continue;
    if(isMainTitleNode(node[k]))node[k]={text:'',margin:[0,0,0,0],fontSize:1};
    else stripMainTitles(node[k]);
  }
}
function applyDynamicTitle(docDefinition){
  const title=dynamicPdfTitle(docDefinition);
  if(Array.isArray(docDefinition?.content)){
    stripMainTitles(docDefinition.content);
    docDefinition.content.unshift({text:title,alignment:'center',bold:true,fontSize:18,margin:[0,0,0,20]});
  }
  if(docDefinition?.info&&typeof docDefinition.info==='object')docDefinition.info.title=title;
  return docDefinition;
}"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('bloco de título global não localizado')
          p.write_text(s,encoding='utf-8')

          for name in ('service-worker.js','sw.js'):
              p=Path(name);s=p.read_text(encoding='utf-8')
              s=re.sub(r"const CACHE='inspecao-sst-v\d+'","const CACHE='inspecao-sst-v81'",s,1)
              s=re.sub(r"\?v=\d+","?v=81",s)
              p.write_text(s,encoding='utf-8')
      - name: Validar padrão final
        run: |
          node --check integracao-modulos.js
          node --check pdf-global-standard.js
          node --check pdf-filename-global.js
          grep -q "width=160" integracao-modulos.js
          grep -q "width:160" integracao-modulos.js
          grep -q "fontSize:18,margin:\[0,0,0,20\]" pdf-global-standard.js
          grep -q "RELATORIO_" pdf-filename-global.js
          grep -q "inspecao-sst-v81" service-worker.js
      - name: Commit da padronização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integracao-modulos.js pdf-global-standard.js service-worker.js sw.js
          git commit -m "Padroniza cabecalho logo 160 e titulo global dos PDFs"
          git push origin main
