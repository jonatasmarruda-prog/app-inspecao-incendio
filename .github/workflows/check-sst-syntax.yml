name: Verificar sintaxe SST
on:
  workflow_dispatch:
  push:
    paths:
      - 'AUDIT_FIX_TRIGGER.txt'
      - '*.js'
      - 'api/**/*.js'
      - 'functions/**/*.js'
      - 'index.html'
      - 'premium.css'
      - '.github/workflows/check-sst-syntax.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir duplicidades residuais quando solicitado
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Executa correcao residual da auditoria')
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="./extintor-enhancements.js?v=20260903-01" defer></script>','')
          s=s.replace('<script src="./delete-draft.js?v=20260903-01"></script>','')
          assert s.count('extintor-enhancements.js')==1, 'extintor-enhancements continua duplicado'
          assert s.count('delete-draft.js')==1, 'delete-draft continua duplicado'
          p.write_text(s,encoding='utf-8')
          Path('AUDIT_FIX_TRIGGER.txt').unlink(missing_ok=True)
          PY
      - name: Verificar sintaxe de todo JavaScript ativo
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find api functions -type f -name '*.js' -print0 2>/dev/null | sort -z | xargs -0 -r -n1 node --check
          echo "SINTAXE_OK"
      - name: Verificar scripts locais duplicados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          srcs=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']',html,re.I)
          locais=[s.split('?',1)[0].split('#',1)[0] for s in srcs if s.startswith('./')]
          duplicados=sorted({x for x in locais if locais.count(x)>1})
          assert not duplicados, f'Scripts locais duplicados: {duplicados}'
          print('DUPLICIDADES_OK')
          PY
      - name: Commitar correcao residual
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Executa correcao residual da auditoria')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove cargas duplicadas residuais do index"
          git push
