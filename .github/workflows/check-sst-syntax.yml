name: Verificar sintaxe SST
on:
  workflow_dispatch:
  push:
    paths:
      - '*.js'
      - 'api/**/*.js'
      - 'functions/**/*.js'
      - 'index.html'
      - 'premium.css'
      - '.github/workflows/check-sst-syntax.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe de todo JavaScript ativo
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find api functions -type f -name '*.js' -print0 2>/dev/null | sort -z | xargs -0 -r -n1 node --check
          echo "SINTAXE_OK"
      - name: Verificar invariantes de estabilidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          srcs=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']',html,re.I)
          locais=[]
          for src in srcs:
              if src.startswith('./'):
                  locais.append(src.split('?',1)[0].split('#',1)[0])
          duplicados=sorted({x for x in locais if locais.count(x)>1})
          assert not duplicados, f'Scripts locais duplicados no index: {duplicados}'

          premium=Path('premium.css').read_text(encoding='utf-8')
          assert '.accident-causes .accident-cause' in premium
          assert 'color:#212529!important' in premium

          integracao=Path('integracao-modulos.js').read_text(encoding='utf-8')
          for token in [
              "https://i.postimg.cc/rFWSj5mw/10.png",
              'LOGO_TBM_LOCAL',
              'LOGO_TBM_CACHE_KEY',
              'LOGO_TBM_TRANSPARENT',
              'width:160',
              "'#198754'",
              "'#dc3545'",
              "'#6c757d'",
              "color:'#ffffff'"
          ]:
              assert token in integracao, f'Invariante PDF/logo ausente: {token}'

          global_pdf=Path('pdf-global-standard.js').read_text(encoding='utf-8')
          assert "alignment:'center'" in global_pdf and 'fontSize:18' in global_pdf

          fire=Path('pdf-layout-fix.js').read_text(encoding='utf-8')
          assert 'if(temExtintor)' in fire and 'if(temHidrante)' in fire

          preview=Path('global-pdf-preview.js').read_text(encoding='utf-8')
          assert 'URL.createObjectURL' in preview
          assert 'about:blank' not in preview

          loader=Path('sst-repair-loader.js').read_text(encoding='utf-8')
          assert "pdf-final-fix.js?v=20260903-02&cb=" in loader

          for sw in ['service-worker.js','sw.js']:
              text=Path(sw).read_text(encoding='utf-8')
              assert 'inspecao-sst-v85' in text
              assert 'Têxtil Bezerra de Menezes 2.jpeg' in text

          print('INVARIANTES_OK')
          PY
