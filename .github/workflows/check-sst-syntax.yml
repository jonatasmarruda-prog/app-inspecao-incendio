name: Verificar sintaxe SST
on:
  workflow_dispatch:
  push:
    paths:
      - 'sst-modulos.js'
      - 'integracao-modulos.js'
      - 'sst-repair-loader.js'
      - 'ACCIDENT_INJURY_TRIGGER.txt'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check sst-modulos.js
          node --check integracao-modulos.js
          node --check sst-repair-loader.js
          node --check accident-injury-module.js
          echo "SINTAXE_OK"
  install-accident-injury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conectar modulo ao loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('sst-repair-loader.js')
          s=p.read_text(encoding='utf-8')
          if 'function loadAccidentInjuryModule()' not in s:
              anchor="function loadSolidStatusBadges(){const old=document.getElementById('tbm-solid-status-badges');if(old)old.remove();const s=document.createElement('script');s.id='tbm-solid-status-badges';s.src='./solid-status-badges.js?v=20260904-01&cb='+Date.now();s.async=false;document.body.appendChild(s);return new Promise(resolve=>{s.onload=resolve;s.onerror=resolve})}\n"
              insert=anchor+"function loadAccidentInjuryModule(){const old=document.getElementById('tbm-accident-injury-module');if(old)old.remove();const s=document.createElement('script');s.id='tbm-accident-injury-module';s.src='./accident-injury-module.js?v=20260904-01&cb='+Date.now();s.async=false;document.body.appendChild(s);return new Promise(resolve=>{s.onload=resolve;s.onerror=resolve})}\n"
              if anchor not in s: raise SystemExit('Ponto de carga Solid Badges não encontrado')
              s=s.replace(anchor,insert,1)
          old="  await loadSolidStatusBadges();\n  setTimeout(loadCloudCrossDevice,0);"
          new="  await loadSolidStatusBadges();\n  // Detalhamento avançado de lesão da Investigação de Acidente, isolado dos demais módulos.\n  await loadAccidentInjuryModule();\n  setTimeout(loadCloudCrossDevice,0);"
          if 'await loadAccidentInjuryModule();' not in s:
              if old not in s: raise SystemExit('Ponto de execução final não encontrado')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Atualizar cache PWA
        shell: python
        run: |
          from pathlib import Path
          for name in ('service-worker.js','sw.js'):
              p=Path(name);s=p.read_text(encoding='utf-8')
              import re
              m=re.search(r"const CACHE='inspecao-sst-v(\d+)'",s)
              if not m: raise SystemExit(f'Cache não encontrado em {name}')
              nv=max(int(m.group(1))+1,78)
              s=re.sub(r"const CACHE='inspecao-sst-v\d+'",f"const CACHE='inspecao-sst-v{nv}'",s,1)
              s=re.sub(r"\?v=\d+",f"?v={nv}",s)
              if "'./accident-injury-module.js'" not in s:
                  s=s.replace("'./training-attendance-refinement.js'","'./training-attendance-refinement.js','./accident-injury-module.js'",1)
              p.write_text(s,encoding='utf-8')
      - name: Validar instalacao
        run: |
          node --check accident-injury-module.js
          node --check sst-repair-loader.js
          grep -q "loadAccidentInjuryModule" sst-repair-loader.js
          grep -q "accident-injury-module.js" service-worker.js
          grep -q "DETALHAMENTO DA LESÃO" accident-injury-module.js
          grep -q "map-cabeca" accident-injury-module.js
          grep -q "map-costas" accident-injury-module.js
      - name: Commit da instalacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst-repair-loader.js service-worker.js sw.js
          git commit -m "Integra mapa anatomico e detalhamento de lesao na investigacao de acidente"
          git push origin main
