name: Apply Global PDF Contrast Direct

on:
  push:
    paths:
      - '.github/scripts/apply_global_pdf_contrast.py'
      - 'PDF_CONTRAST_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply direct PDF contrast patches
        run: python .github/scripts/apply_global_pdf_contrast.py
      - name: Validate JavaScript syntax
        run: |
          node --check pt-altura.js
          node --check nr24-module.js
          node --check pdf-layout-fix.js
      - name: Commit generator changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt-altura.js nr24-module.js pdf-layout-fix.js
          if git diff --cached --quiet; then
            echo "No generator changes required"
          else
            git commit -m "Padroniza contraste Premium diretamente em todos os geradores PDF"
            git push origin main
          fi
