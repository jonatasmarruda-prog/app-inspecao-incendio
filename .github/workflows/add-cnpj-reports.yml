name: Adicionar CNPJ aos relatórios
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar CNPJ integrado ao relatório
        run: |
          grep -q "07.603.376/0003-00" sst-modulos.js
          echo "CNPJ da TBM Têxtil já está integrado ao módulo de relatórios."
