name: Hotfix PT mobile performance

on:
  push:
    paths:
      - '.github/workflows/hotfix-pt-touch-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch da PT
        run: python3 .github/scripts/patch_pt_mobile_performance.py

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt-altura.js sst-repair-loader.js
          if git diff --cached --quiet; then
            echo "Sem alterações pendentes"
            exit 0
          fi
          git commit -m "Corrige travamento da PT ao tocar no checklist"
          git pull --rebase origin main
          git push origin HEAD:main
