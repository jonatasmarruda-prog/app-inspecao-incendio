name: Teste funcional do aplicativo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check sst-modulos.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          if not scripts: raise SystemExit('Nenhum script inline encontrado no index.html')
          for i,s in enumerate(scripts): Path(f'/tmp/index-{i}.js').write_text(s,encoding='utf-8')
          print(f'{len(scripts)} script(s) inline extraído(s)')
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Aguardar GitHub Pages
        run: |
          for i in {1..36}; do
            code=$(curl -L -s -o /tmp/site.html -w '%{http_code}' "https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?e2e=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -q 'Inspeção de Incêndio' /tmp/site.html && grep -q 'sst-modulos.js' /tmp/site.html; then echo 'Pages disponível com o módulo SST'; break; fi
            echo "Aguardando Pages ($i/36)..."; sleep 10
          done
          test -s /tmp/site.html

      - name: Testes E2E no aplicativo publicado
        run: |
          cat > /tmp/e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}, serviceWorkers:'allow'});
          const errors=[];
          page.on('pageerror', e => errors.push(e.message));
          await page.goto('https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?e2e=' + Date.now(), {waitUntil:'networkidle', timeout:60000});
          await page.waitForSelector('#sst-menu', {timeout:30000});
          const modules=[['seg','Inspeção de Segurança'],['machine','Máquinas e Equipamentos'],['epi','Inspeção de EPI'],['accident','Investigação de Acidente'],['report','Relatório de Inspeção']];
          for(const [key,label] of modules){
            await page.locator(`[data-sst="${key}"]`).click();
            if(!(await page.locator('#sstBody').innerText()).includes(label)) throw new Error(`Módulo não abriu: ${label}`);
            if(key!=='accident'){
              const choice=page.locator('#s-checks .choices').first();
              if(await choice.count()){
                await choice.locator('button[data-v="BOM"]').click();
                if(!(await choice.getAttribute('class')).includes('ok')) throw new Error(`Checklist BOM falhou: ${label}`);
                await choice.locator('button[data-v="NÃO CONFORME"]').click();
                if(!(await choice.getAttribute('class')).includes('no')) throw new Error(`Checklist NÃO CONFORME falhou: ${label}`);
              }
            }
            if(key==='report') await page.locator('#s-irregularity').fill('Teste funcional');
            if(key==='accident') await page.locator('#s-acc-desc').fill('Teste funcional do fluxo de investigação.');
            await page.locator('#s-save').click();
            await page.waitForTimeout(500);
            if(!(await page.locator('#s-msg').innerText()).includes('salva com sucesso')) throw new Error(`Salvar falhou: ${label}`);
            await page.locator('#s-savepdf').click();
            await page.waitForSelector('#sstPrint',{timeout:5000});
            if(!(await page.locator('#sst-print').count())) throw new Error(`Relatório não gerou: ${label}`);
            await page.locator('#sstReportBack').click();
            await page.locator('#sstClose').click();
          }
          if(errors.length) throw new Error('Erros JavaScript: '+errors.join(' | '));
          console.log('TESTE FUNCIONAL E2E: OK');
          await browser.close();
          EOF
          node /tmp/e2e.mjs
