name: Teste funcional do aplicativo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check sst-modulos.js
          node --check sw.js
          node --check offline-boot.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8'); assert 'sst-modulos.js' in h and 'offline-boot.js' in h
          ss=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',h,re.I)
          for i,s in enumerate(ss): Path(f'/tmp/i{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Auditoria E2E completa
        run: |
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 & sleep 2
          cat >/tmp/e2e.cjs <<'EOF'
          const {chromium}=require('playwright'); const assert=(x,m)=>{if(!x)throw Error(m)};
          const waitText=async(p,s,t)=>p.waitForFunction(([sel,txt])=>document.querySelector(sel)?.textContent.includes(txt),[s,t],{timeout:12000});
          const drawCanvas=async(p,sel)=>{await p.locator(sel).evaluate(c=>{const x=c.getContext('2d');x.lineWidth=3;x.strokeStyle='#111';x.beginPath();x.moveTo(20,30);x.lineTo(140,55);x.stroke()})};
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));
          await p.goto('http://127.0.0.1:4173/?e2e='+Date.now(),{waitUntil:'networkidle'});await p.waitForSelector('#start');await p.waitForSelector('#sst-menu');
          await p.locator('#start').click();await p.locator('#addExt').click();await p.locator('#addHid').click();const es=p.locator('#equipmentList .equip');assert(await es.count()===2,'Falha ao adicionar equipamentos');const e=es.nth(0),h=es.nth(1),d=new Date().toISOString().slice(0,10);
          await e.locator('[data-f="sector"]').fill('Produção');await e.locator('[data-f="place"]').fill('Extintor teste');await e.locator('[data-f="etype"]').selectOption({label:'CO₂'});await e.locator('[data-f="capacity"]').selectOption({label:'6 kg'});await e.locator('[data-f="lastInspection"]').fill(d);await h.locator('[data-f="sector"]').fill('Produção');await h.locator('[data-f="place"]').fill('Hidrante teste');await h.locator('[data-f="lastHoseTest"]').fill(d);
          for(const card of [e,h]){const bs=card.locator('[data-checks] button[data-v="ok"]');for(let i=0;i<await bs.count();i++)await bs.nth(i).click();}
          const jpg=Buffer.from('','base64');await e.locator('[data-gallery]').setInputFiles({name:'teste.jpg',mimeType:'image/jpeg',buffer:jpg});await p.waitForSelector('[data-photos] img');
          await drawCanvas(p,'#sig1');const sigPixels=await p.locator('#sig1').evaluate(c=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]>0)return true;return false});assert(sigPixels,'Canvas de assinatura não recebeu traço');await p.evaluate(()=>window.eval("current.sig1=document.getElementById('sig1').toDataURL('image/png')"));await p.locator('#save').click();await waitText(p,'#msg','salva com sucesso');await p.locator('#pdf').click();await p.waitForSelector('#reportContent');assert((await p.locator('#reportContent').innerText()).includes('HIDRANTE #2'),'Relatório não reuniu equipamentos');await p.locator('#reportBack').click();await p.locator('#back').click();
          const mods=[['seg','Inspeção de Segurança'],['machine','Máquinas e Equipamentos'],['epi','Inspeção de EPI'],['accident','Investigação de Acidente'],['report','Relatório de Inspeção']];for(const [key,label] of mods){await p.locator(`[data-sst="${key}"]`).click();assert((await p.locator('#sstBody').innerText()).includes(label),`Módulo não abriu: ${label}`);if(key!=='accident'){const ch=p.locator('#s-checks .choices').first();assert(await ch.count()>0,`Checklist ausente: ${label}`);await ch.locator('button[data-v="BOM"]').click();assert((await ch.locator('button[data-v="BOM"]').getAttribute('class')).includes('ok'),`BOM falhou: ${label}`);await ch.locator('button[data-v="NÃO CONFORME"]').click();assert((await ch.locator('button[data-v="NÃO CONFORME"]').getAttribute('class')).includes('no'),`NÃO CONFORME falhou: ${label}`);}if(key==='report')await p.locator('#s-irregularity').fill('Teste funcional');if(key==='accident')await p.locator('#s-acc-desc').fill('Teste funcional do acidente.');await drawCanvas(p,'#s-sign');await p.locator('#s-save').click();await waitText(p,'#s-msg','salva com sucesso');await p.locator('#s-pdf').click();await p.waitForSelector('#sstPrint',{timeout:5000});assert(await p.locator('#sst-print').count()===1,`Relatório não gerou: ${label}`);await p.locator('#sstReportBack').click();await p.locator('#sstClose').click();}
          await p.waitForFunction(()=>navigator.serviceWorker&&navigator.serviceWorker.ready,{timeout:15000});await p.waitForFunction(()=>!!navigator.serviceWorker.controller,{timeout:15000});await c.setOffline(true);await p.reload({waitUntil:'domcontentloaded',timeout:30000});assert(await p.locator('#start').count()===1,'Modo offline falhou');await c.setOffline(false);assert(errs.length===0,'Erros JavaScript: '+errs.join(' | '));console.log('AUDITORIA E2E COMPLETA: OK');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/e2e.cjs
      - name: Verificar GitHub Pages
        run: |
          for i in {1..30}; do code=$(curl -L -s -o /tmp/pages.html -w '%{http_code}' 'https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?check='${GITHUB_SHA}); if [ "$code" = "200" ] && grep -q 'sst-modulos.js' /tmp/pages.html && grep -q 'offline-boot.js' /tmp/pages.html; then echo 'GitHub Pages OK'; exit 0; fi; sleep 5; done; exit 1
