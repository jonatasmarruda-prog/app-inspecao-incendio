name: Teste funcional do aplicativo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe JavaScript
        run: |
          set -e
          for f in premium.js sst-modulos.js offline-boot.js sst-repair-loader.js compartilhar-relatorio.js editar-relatorio.js abnt-relatorio.js integracao-modulos.js master-fix.js firebase-sync.js sw.js service-worker.js; do node --check "$f"; done
      - name: Validar estrutura atual do index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          required=['data-type="fire"','data-type="safety"','data-type="machine"','data-type="epi"','data-type="accident"','data-type="report"','id="openHistory"','id="save"','id="pdf"','id="reportPdf"','id="reportShare"','id="reportContent"','premium.js']
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit('Estrutura ausente: '+', '.join(missing))
          print('ESTRUTURA INDEX: OK')
          PY
      - name: Auditoria E2E da interface principal
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          sleep 2
          cat >/tmp/e2e.cjs <<'EOF'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?e2e='+Date.now(),{waitUntil:'networkidle'});
            await page.waitForSelector('[data-type="fire"]');
            await page.locator('[data-type="fire"]').click();
            await page.waitForSelector('#form');
            assert(await page.locator('#addExt').count()===1,'Botão de extintor não abriu');
            assert(await page.locator('#photoInput').count()===1,'Captura de foto ausente');
            assert(await page.locator('#sig1').count()===1,'Assinatura do inspetor ausente');
            await page.locator('#addExt').click();
            assert(await page.locator('#equipmentList').innerText().then(t=>t.length>0),'Extintor não foi adicionado');
            await page.locator('#backHome').click();
            await page.locator('#openHistory').click();
            await page.waitForSelector('#historyList');
            await page.locator('#historyBack').click();
            assert(errors.length===0,'Erros JavaScript: '+errors.join(' | '));
            console.log('AUDITORIA E2E: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/e2e.cjs
      - name: Verificar GitHub Pages
        run: |
          code=$(curl -L -s -o /tmp/pages.html -w '%{http_code}' "https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?check=${GITHUB_SHA}")
          test "$code" = "200"
          grep -q 'data-type="fire"' /tmp/pages.html
          echo 'GitHub Pages: OK'