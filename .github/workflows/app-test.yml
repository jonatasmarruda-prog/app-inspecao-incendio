name: Teste funcional do aplicativo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check sst-modulos.js
          node --check sw.js
          node --check offline-boot.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          if not scripts: raise SystemExit('Nenhum script inline encontrado no index.html')
          for i,s in enumerate(scripts): Path(f'/tmp/index-{i}.js').write_text(s,encoding='utf-8')
          if 'sst-modulos.js' not in html: raise SystemExit('sst-modulos.js não está integrado')
          if 'offline-boot.js' not in html: raise SystemExit('offline-boot.js não está integrado')
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Aguardar GitHub Pages
        run: |
          for i in {1..36}; do
            code=$(curl -L -s -o /tmp/site.html -w '%{http_code}' "https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?e2e=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -q 'Inspeção de Incêndio' /tmp/site.html && grep -q 'sst-modulos.js' /tmp/site.html && grep -q 'offline-boot.js' /tmp/site.html; then echo 'Pages disponível com SST e PWA'; break; fi
            echo "Aguardando Pages ($i/36)..."; sleep 10
          done
          test -s /tmp/site.html
      - name: Testes E2E no aplicativo publicado
        run: |
          cat > /tmp/e2e.cjs <<'EOF'
          const { chromium } = require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?e2e='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#start',{timeout:30000});
            await page.waitForSelector('#sst-menu',{timeout:30000});
            assert(await page.locator('#sst-menu').count()===1,'Menu SST não apareceu');

            // Incêndio: múltiplos equipamentos, checklist sequencial, foto, assinatura, salvar e relatório.
            await page.locator('#start').click();
            await page.locator('#addExt').click(); await page.locator('#addHid').click();
            const equips=page.locator('#equipmentList .equip'); assert(await equips.count()===2,'Não foi possível adicionar dois equipamentos');
            const ext=equips.nth(0), hid=equips.nth(1), today=new Date().toISOString().slice(0,10);
            await ext.locator('[data-f="sector"]').fill('Produção'); await ext.locator('[data-f="place"]').fill('Extintor teste');
            await ext.locator('[data-f="etype"]').selectOption({label:'CO₂'}); await ext.locator('[data-f="capacity"]').selectOption({label:'6 kg'}); await ext.locator('[data-f="lastInspection"]').fill(today);
            await hid.locator('[data-f="sector"]').fill('Produção'); await hid.locator('[data-f="place"]').fill('Hidrante teste'); await hid.locator('[data-f="lastHoseTest"]').fill(today);
            for(const card of [ext,hid]){const bs=card.locator('[data-checks] button[data-v="ok"]');for(let i=0;i<await bs.count();i++){await bs.nth(i).click();}}
            assert(await ext.locator('[data-count]').innerText()===`${await ext.locator('[data-checks] button[data-v="ok"]').count()}/${await ext.locator('[data-checks] button[data-v="ok"]').count()}`,'Checklist do extintor não completou');
            assert(await hid.locator('[data-count]').innerText()===`${await hid.locator('[data-checks] button[data-v="ok"]').count()}/${await hid.locator('[data-checks] button[data-v="ok"]').count()}`,'Checklist do hidrante não completou');
            const tinyJpeg=Buffer.from('','base64');
            await ext.locator('[data-gallery]').setInputFiles({name:'teste.jpg',mimeType:'image/jpeg',buffer:tinyJpeg}); await page.waitForSelector('[data-photos] img');
            await page.locator('#sig1').scrollIntoViewIfNeeded(); const sig=page.locator('#sig1'); const box=await sig.boundingBox(); assert(box,'Campo de assinatura não encontrado');
            await page.mouse.move(box.x+20,box.y+40); await page.mouse.down(); await page.mouse.move(box.x+100,box.y+55,{steps:8}); await page.mouse.up(); await page.waitForTimeout(100);
            await page.locator('#save').click(); const saveMsg=await page.locator('#msg').innerText(); assert(saveMsg.includes('salva com sucesso'),'Salvar incêndio falhou: '+saveMsg);
            await page.locator('#pdf').click(); await page.waitForSelector('#reportContent'); assert((await page.locator('#reportContent').innerText()).includes('HIDRANTE #2'),'Relatório não reuniu os dois equipamentos'); await page.locator('#reportBack').click(); await page.locator('#back').click();

            // Módulos SST.
            const modules=[['seg','Inspeção de Segurança'],['machine','Máquinas e Equipamentos'],['epi','Inspeção de EPI'],['accident','Investigação de Acidente'],['report','Relatório de Inspeção']];
            for(const [key,label] of modules){
              await page.locator(`[data-sst="${key}"]`).click(); assert((await page.locator('#sstBody').innerText()).includes(label),`Módulo não abriu: ${label}`);
              if(key!=='accident'){const choice=page.locator('#s-checks .choices').first(); if(await choice.count()){await choice.locator('button[data-v="BOM"]').click(); assert((await choice.locator('button[data-v="BOM"]').getAttribute('class')).includes('ok'),`Checklist BOM falhou: ${label}`); await choice.locator('button[data-v="NÃO CONFORME"]').click(); assert((await choice.locator('button[data-v="NÃO CONFORME"]').getAttribute('class')).includes('no'),`Checklist NÃO CONFORME falhou: ${label}`);}}
              if(key==='report')await page.locator('#s-irregularity').fill('Teste funcional'); if(key==='accident')await page.locator('#s-acc-desc').fill('Teste funcional do fluxo de investigação.');
              const c=page.locator('#s-sign'); const cb=await c.boundingBox(); assert(cb,`Assinatura não encontrada: ${label}`); await page.mouse.move(cb.x+15,cb.y+35); await page.mouse.down(); await page.mouse.move(cb.x+90,cb.y+45,{steps:8}); await page.mouse.up();
              await page.locator('#s-save').click(); const m=await page.locator('#s-msg').innerText(); assert(m.includes('salva com sucesso'),`Salvar falhou: ${label}. Mensagem: ${m}`);
              await page.locator('#s-savepdf').click(); await page.waitForSelector('#sstPrint',{timeout:5000}); assert(await page.locator('#sst-print').count()===1,`Relatório não gerou: ${label}`); await page.locator('#sstReportBack').click(); await page.locator('#sstClose').click();
            }

            // PWA/offline.
            await page.waitForFunction(()=>navigator.serviceWorker&&navigator.serviceWorker.ready,{timeout:15000}); await page.waitForFunction(()=>!!navigator.serviceWorker.controller,{timeout:15000}); await context.setOffline(true); await page.reload({waitUntil:'domcontentloaded',timeout:30000}); assert(await page.locator('#start').count()===1,'Aplicativo não abriu offline'); await context.setOffline(false);
            assert(errors.length===0,'Erros JavaScript: '+errors.join(' | ')); console.log('AUDITORIA E2E COMPLETA: OK'); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/e2e.cjs
