name: Teste funcional do aplicativo
on:
  push:
    branches: [main]
  workflow_dispatch:
# Auditoria final obrigatória antes de considerar o sistema estável.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe dos módulos
        run: |
          set -e
          for f in sst-modulos.js offline-boot.js sst-repair-loader.js compartilhar-relatorio.js editar-relatorio.js abnt-relatorio.js integracao-modulos.js sw.js service-worker.js; do node --check "$f"; done
      - name: Validar scripts do index
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert all(x in h for x in ['id="start"','id="startSafety"','id="startMachine"','id="startEpi"','id="startAccident"','id="startReport"','sst-modulos.js','offline-boot.js'])
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',h,re.I)):
              Path(f'/tmp/index-{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Auditoria E2E dos módulos e relatórios
        run: |
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          sleep 2
          cat >/tmp/e2e.cjs <<'EOF'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const page=await ctx.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?e2e='+Date.now(),{waitUntil:'networkidle'});
            await page.waitForSelector('#start');
            await page.waitForSelector('#sst-menu');
            const modules=[['seg','Inspeção de Segurança'],['machine','Máquinas e Equipamentos'],['epi','Inspeção de EPI'],['accident','Investigação de Acidente'],['report','Relatório de Inspeção']];
            for(const [kind,label] of modules){
              await page.locator('#sst-menu [data-sst="'+kind+'"]').click();
              await page.waitForSelector('#sstBody');
              assert((await page.locator('#sstBody').innerText()).includes(label),'Módulo não abriu: '+label);
              if(['seg','machine','epi'].includes(kind)){const c=page.locator('#s-checks .choices').first();await c.locator('button[data-v="BOM"]').click();assert((await c.locator('button[data-v="BOM"]').getAttribute('class')).includes('ok'),'BOM falhou: '+label);await c.locator('button[data-v="NÃO CONFORME"]').click();assert((await c.locator('button[data-v="NÃO CONFORME"]').getAttribute('class')).includes('no'),'NÃO CONFORME falhou: '+label);}
              if(kind==='machine')await page.locator('#s-machine').fill('Máquina teste');
              if(kind==='epi')await page.locator('#s-epi').fill('EPI teste');
              if(kind==='report')await page.locator('#s-irregularity').fill('Irregularidade teste');
              if(kind==='accident')await page.locator('#s-acc-desc').fill('Descrição do acidente teste');
              await page.locator('#s-save').click();
              await page.waitForFunction(()=>document.querySelector('#s-msg')?.textContent.includes('salva com sucesso'));
              await page.locator('#s-pdf').click();
              await page.waitForSelector('#sstPrint');
              assert(await page.locator('#sst-print').count()===1,'Relatório não gerou: '+label);
              await page.locator('#sstReportBack').click();
            }
            await page.locator('#sstClose').click();
            await page.locator('#start').click();
            await page.locator('#addExt').click();
            await page.locator('#addHid').click();
            assert(await page.locator('#equipmentList .equip').count()===2,'Extintor/hidrante não foram adicionados');
            await page.locator('#back').click();
            await page.waitForFunction(()=>navigator.serviceWorker&&navigator.serviceWorker.ready);
            await page.waitForFunction(()=>!!navigator.serviceWorker.controller);
            await ctx.setOffline(true);
            await page.reload({waitUntil:'domcontentloaded'});
            assert(await page.locator('#start').count()===1,'Aplicação não reabriu offline');
            await ctx.setOffline(false);
            assert(errors.length===0,'Erros JavaScript: '+errors.join(' | '));
            console.log('AUDITORIA E2E: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/e2e.cjs
      - name: Verificar GitHub Pages
        run: |
          for i in {1..30}; do
            code=$(curl -L -s -o /tmp/pages.html -w '%{http_code}' "https://jonatasmarruda-prog.github.io/app-inspecao-incendio/?check=${GITHUB_SHA}");
            if [ "$code" = "200" ] && grep -q 'sst-modulos.js' /tmp/pages.html && grep -q 'offline-boot.js' /tmp/pages.html; then echo 'GitHub Pages OK'; exit 0; fi
            sleep 5
          done
          exit 1
