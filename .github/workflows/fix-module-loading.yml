name: Corrigir carregamento dos módulos SST

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garantir scripts dos módulos no HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="./integracao-modulos.js?v=20260903-21"></script><script src="./sst-repair-loader.js?v=20260903-21"></script>'
          if 'integracao-modulos.js?v=20260903-21' not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html sem </body>')
              s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Carregar módulos SST no index"
          git push
