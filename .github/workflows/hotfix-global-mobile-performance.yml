name: Hotfix global mobile performance

on:
  push:
    paths:
      - '.github/workflows/hotfix-global-mobile-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar otimizações globais
        run: python3 .github/scripts/patch_global_mobile_performance.py

      - name: Publicar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add save-button-fix.js fire-checklist-split.js photo-multi-fix.js premium.js cloud-cross-device.js checklist-conditional.js delete-draft.js premium-ux.js index.html sst-repair-loader.js service-worker.js sw.js
          if git diff --cached --quiet; then
            echo "Sem alterações pendentes"
            exit 0
          fi
          git commit -m "Remove gargalos e travamentos do app SST"
          git pull --rebase origin main
          git push origin HEAD:main
