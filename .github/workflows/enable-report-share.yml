name: Enable report sharing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-share:
    if: ${{ !contains(github.event.head_commit.message, 'feat: habilitar compartilhamento de relatórios') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add native report sharing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SST-NATIVE-SHARE -->'
          if marker in s:
              print('Compartilhamento já instalado.')
              raise SystemExit(0)
          block = r'''<!-- SST-NATIVE-SHARE -->
          <style>
          #sst-share-report{background:#15803d;color:#fff;width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;font:800 16px Arial,sans-serif;cursor:pointer}
          #sst-share-report:active{transform:scale(.99);filter:brightness(.95)}
          </style>
          <script>
          (()=>{
            const install=()=>{
              if(document.getElementById('sst-share-report')) return;
              const pdf=[...document.querySelectorAll('button')].find(b=>/SALVAR E GERAR RELAT[ÓO]RIO|Imprimir \/ Salvar PDF/i.test((b.textContent||'').trim()));
              if(!pdf) return;
              const b=document.createElement('button');
              b.id='sst-share-report';
              b.type='button';
              b.className='no-print';
              b.textContent='📤 COMPARTILHAR RELATÓRIO';
              b.addEventListener('click',async()=>{
                const report=document.querySelector('.report');
                const title='Relatório de Inspeção SST';
                const text=report ? report.innerText.trim() : 'Relatório de Inspeção SST';
                try{
                  if(navigator.share){
                    await navigator.share({title,text});
                  }else{
                    const wa='https://wa.me/?text='+encodeURIComponent(text);
                    window.open(wa,'_blank');
                  }
                }catch(e){
                  if(e && e.name==='AbortError') return;
                  const wa='https://wa.me/?text='+encodeURIComponent(text);
                  window.open(wa,'_blank');
                }
              });
              pdf.parentNode.insertBefore(b,pdf);
            };
            new MutationObserver(install).observe(document.body,{childList:true,subtree:true});
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();
          })();
          </script>'''
          if '</body>' not in s:
              raise SystemExit('index.html sem </body>')
          s=s.replace('</body>', block+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Compartilhamento nativo instalado.')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: habilitar compartilhamento de relatórios'
          git push
