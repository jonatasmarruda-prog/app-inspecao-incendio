name: Premium System Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify premium files
        shell: bash
        run: |
          test -f index.html
          test -f premium.css
          test -f premium.js
          echo "Premium layer preserved; no automatic overwrite."
