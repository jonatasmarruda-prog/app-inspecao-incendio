name: Premium System Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stable premium layer
        shell: bash
        run: |
          cat > premium.css <<'EOF'
          :root{--premium-bg:#070b10;--premium-panel:#0d131a;--premium-panel2:#111922;--premium-line:#26313d;--premium-text:#f5f7fa;--premium-muted:#a8b2bd;--premium-red:#ff2d20}
          body{background:radial-gradient(circle at 50% -10%,#18222d 0,#070b10 42%,#05080c 100%)!important;color:var(--premium-text)!important}
          .top{background:rgba(5,9,13,.94)!important;border-bottom:1px solid #26313d!important;box-shadow:0 8px 35px #0008!important;backdrop-filter:blur(14px)}
          .topin{max-width:1180px!important;padding:10px 22px!important;min-height:82px}
          .logo{width:76px!important;height:76px!important;border-radius:14px!important;background:#fff!important;padding:4px!important;object-fit:contain!important;display:block!important}
          .brand b{font-size:19px!important;letter-spacing:.3px}.brand span{color:#aeb8c3!important}
          #cloudState{color:#45f06b!important;background:#111a16;padding:9px 13px;border-radius:999px;border:1px solid #24472d}
          .wrap{max-width:1180px!important;padding:24px!important}
          .hero{background:transparent!important;border:0!important;box-shadow:none!important;padding:8px 0 30px!important}
          .badge{background:#131a22!important;color:#dbe4ec!important;border:1px solid #2b3743!important}
          .hero h1{display:none}.hero>p{display:none}.today{background:transparent!important;border:0!important;margin:8px 0 28px!important;padding:0!important;text-align:center}.today small{color:#697784}.today strong{font-size:22px!important;color:#f7f9fb}.today span{color:#8e9ba7}
          .title{color:#fff!important;text-align:left!important;font-size:18px!important;margin:0 0 14px!important}
          .tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important}
          .tile{min-height:190px!important;background:linear-gradient(145deg,#10171f,#0b1117)!important;border:1px solid #27323d!important;border-radius:20px!important;padding:24px!important;box-shadow:0 14px 38px #0007!important;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s!important}
          .tile:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px}.tile:hover{transform:translateY(-3px);border-color:#3b4754;box-shadow:0 20px 45px #000a}
          .tile .ico{font-size:44px!important;text-align:center;margin-bottom:8px}.tile b{font-size:17px!important;text-align:center;display:block}.tile span{font-size:13px!important;text-align:center;color:#b5bec8;margin-top:8px!important;line-height:1.45}
          .fire:after{background:#ff2d20}.safety:after{background:#49df35}.machine:after{background:#ffd21c}.epi:after{background:#1688ff}.accident:after{background:#b24cff}.general:after{background:#19d8e8}
          #openHistory{margin-top:20px!important;background:linear-gradient(145deg,#111821,#0c1218)!important;color:#f5f7fa!important;border:1px solid #27323d!important;min-height:82px;border-radius:18px!important;text-align:left!important;padding:20px!important;font-size:16px!important;box-shadow:0 12px 30px #0006!important}
          .statusline{color:#8f9ba7!important;margin-top:18px!important}
          .card{background:#0d131a!important;border-color:#26313d!important;color:#f4f6f8!important;box-shadow:0 14px 35px #0007!important}.field label,.sectionTitle,.equipment h3,.check b{color:#f4f6f8!important}.field input,.field select,.field textarea,.checkrow select{background:#101820!important;color:#f4f6f8!important;border-color:#2a3642!important}.secondary{background:#17212b!important;color:#f4f6f8!important}.counter div{background:#121b24!important;color:#fff!important}.equipment,.check,.photoCard{background:#0b1219!important;border-color:#293641!important}
          .sigwrap{background:#fff!important;border:2px solid #94a3b8!important;box-shadow:inset 0 0 0 1px #e2e8f0,0 8px 22px #0002!important}.sigwrap canvas{background:#fff!important;color:#111827!important;border:0!important;touch-action:none!important;cursor:crosshair!important}.sigwrap:before{content:"ASSINE DENTRO DO QUADRO";display:block;background:#f8fafc;color:#64748b;font-size:9px;font-weight:900;letter-spacing:.8px;text-align:center;padding:6px;border-bottom:1px solid #e2e8f0}
          .reportShell,.reportPage{background:#fff!important;color:#17202b!important}.reportPage{border-radius:0}.reportHeader{border-bottom-color:#8b1018}.reportLogo{width:92px!important;height:92px!important;background:#fff!important;object-fit:contain!important}
          .photoTools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cameraBtn,.galleryBtn{min-height:52px!important;border-radius:14px!important;font-weight:900!important;border:1px solid #334155!important;box-shadow:0 10px 24px #0004!important}.cameraBtn{background:linear-gradient(145deg,#b91c1c,#ef4444)!important;color:#fff!important}.galleryBtn{background:#17212b!important;color:#f8fafc!important}#photoInput{display:none!important}.photoHint{margin-top:9px;font-size:11px;color:#94a3b8;line-height:1.45}.photoCard img{background:#f8fafc!important;object-fit:cover!important}
          @media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
          @media(max-width:560px){.wrap{padding:14px!important}.topin{padding:8px 14px!important}.logo{width:64px!important;height:64px!important}.brand b{font-size:16px!important}.tiles{grid-template-columns:1fr!important;gap:12px!important}.tile{min-height:155px!important;padding:20px!important}.tile .ico{font-size:38px!important}.reportLogo{width:76px!important;height:76px!important}.photoTools{grid-template-columns:1fr!important}}
          EOF

          cat > premium.js <<'EOF'
          (function(){
            'use strict';
            function setup(){
              var title=document.querySelector('.brand b');
              if(title) title.textContent='SISTEMA DE INSPEÇÃO SST';
              var sub=document.querySelector('.brand span');
              if(sub) sub.textContent='TBM Têxtil • Controle Profissional';
              var badge=document.querySelector('.badge');
              if(badge) badge.textContent='SISTEMA PROFISSIONAL DE INSPEÇÃO';
              document.querySelectorAll('img.logo,img.reportLogo').forEach(function(img){img.src='./icon.svg?v=20260903-27';img.alt='TBM Têxtil';});
              var input=document.getElementById('photoInput');
              if(input&&!input.dataset.cameraReady){
                input.dataset.cameraReady='1';
                input.setAttribute('accept','image/*');
                input.setAttribute('capture','environment');
                var tools=document.createElement('div');tools.className='photoTools';
                var cam=document.createElement('button');cam.type='button';cam.className='btn cameraBtn';cam.textContent='📷 TIRAR FOTO';cam.onclick=function(){input.click()};
                var gal=document.createElement('button');gal.type='button';gal.className='btn galleryBtn';gal.textContent='🖼️ ESCOLHER DA GALERIA';gal.onclick=function(){input.removeAttribute('capture');input.click();setTimeout(function(){input.setAttribute('capture','environment')},500)};
                tools.appendChild(cam);tools.appendChild(gal);input.insertAdjacentElement('afterend',tools);
                var hint=document.createElement('div');hint.className='photoHint';hint.textContent='Tire a foto diretamente pela câmera ou escolha uma imagem da galeria.';tools.insertAdjacentElement('afterend',hint);
              }
              var status=document.getElementById('cloudState');
              if(status&&!status.dataset.premiumObserver){
                status.dataset.premiumObserver='1';
                new MutationObserver(function(){if(/Nuvem ativa/i.test(status.textContent))status.textContent='● Online';else if(/Local/i.test(status.textContent))status.textContent='● Offline local';}).observe(status,{childList:true,subtree:true,characterData:true});
              }
            }
            function ready(){setup();setTimeout(setup,700);setTimeout(setup,1800);}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("$('premiumToday').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});$('premiumTime').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})", "$('todayDate').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});$('todayTime').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})")
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html premium.css premium.js
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'fix: stabilize premium UI camera and signature'
          git push
