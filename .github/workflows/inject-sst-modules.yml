name: Integrar módulos SST
on:
  push:
    paths:
      - 'sst-modulos.js'
      - 'index.html'
      - '.github/workflows/inject-sst-modules.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar script SST
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="sst-modulos.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Não encontrei </body> no index.html')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Integrate SST inspection modules'
          git push