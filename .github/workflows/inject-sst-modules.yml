name: Integrar módulos SST e PWA
on:
  push:
    paths:
      - 'sst-modulos.js'
      - 'offline-boot.js'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/inject-sst-modules.yml'
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[auto-integracao]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar scripts e corrigir conflitos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Namespace do módulo SST: não pode expor save() global.
          p=Path('sst-modulos.js'); s=p.read_text(encoding='utf-8'); old=s
          s=s.replace('async function save(rec)', 'async function saveSST(rec)')
          s=s.replace('await save({', 'await saveSST({')
          s=s.replace('await save(rec)', 'await saveSST(rec)')
          if s!=old:p.write_text(s,encoding='utf-8')
          # Namespace do módulo de incêndio: evita colisão com IDs/propriedades globais do navegador.
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=s
          s=s.replace('async function save(makeReport)', 'async function saveInspection(makeReport)')
          s=s.replace("$('pdf').onclick=()=>save(true)", "$('pdf').onclick=()=>saveInspection(true)")
          s=s.replace("$('save').onclick=()=>save(false)", "$('save').onclick=()=>saveInspection(false)")
          for tag in ['<script src="sst-modulos.js"></script>','<script src="offline-boot.js"></script>']:
              if tag not in s:
                  marker='</body>'
                  if marker not in s: raise SystemExit('Não encontrei </body> no index.html')
                  s=s.replace(marker,tag+marker,1)
          if s!=old:p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sst-modulos.js
          git diff --cached --quiet || git commit -m 'Integrate SST and offline PWA [auto-integracao]'
          git push
