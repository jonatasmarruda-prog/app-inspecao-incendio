name: Integrar módulos SST e PWA
on:
  push:
    paths:
      - 'sst-modulos.js'
      - 'offline-boot.js'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/inject-sst-modules.yml'
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[auto-integracao]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar scripts e corrigir conflitos
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('sst-modulos.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('async function save(rec)', 'async function saveSST(rec)').replace('await save({','await saveSST({').replace('await save(rec)','await saveSST(rec)')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('async function save(makeReport)', 'async function saveInspection(makeReport)').replace("$('pdf').onclick=()=>save(true)","$('pdf').onclick=()=>saveInspection(true)").replace("$('save').onclick=()=>save(false)","$('save').onclick=()=>saveInspection(false)")
          # Canvas de assinatura robusto para Android/iPhone: eventos pointer e coordenadas corretas.
          robust="""function setupSignature(c,key,data){const ctx=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);c.style.touchAction='none';c.width=Math.max(1,Math.round(c.clientWidth*dpr));c.height=Math.round(96*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false,moved=false;if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,96);im.src=data}const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.addEventListener('pointerdown',e=>{drawing=true;moved=false;if(c.setPointerCapture){try{c.setPointerCapture(e.pointerId)}catch(_){}}const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},{passive:false});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();moved=true;e.preventDefault()},{passive:false});const end=e=>{if(!drawing)return;drawing=false;if(moved)current[key]=c.toDataURL('image/png');autosave();e.preventDefault()};c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});c.addEventListener('pointerleave',e=>{if(drawing&&e.buttons===0)end(e)},{passive:false})}"""
          s=re.sub(r'function setupSignature\(c,key,data\)\{[\s\S]*?\}\nfunction sync',robust+'\nfunction sync',s,count=1)
          for tag in ['<script src="sst-modulos.js"></script>','<script src="offline-boot.js"></script>']:
              if tag not in s:
                  marker='</body>'
                  if marker not in s: raise SystemExit('Não encontrei </body> no index.html')
                  s=s.replace(marker,tag+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sst-modulos.js
          git diff --cached --quiet || git commit -m 'Integrate SST and offline PWA [auto-integracao]'
          git push
