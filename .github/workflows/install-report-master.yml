name: Instalar relatório Master
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.event.head_commit.message != 'feat: ativar relatório PDF Master profissional'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir módulo no aplicativo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./report-master.js?v=20260903-01"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: ativar relatório PDF Master profissional' || exit 0
          git push
