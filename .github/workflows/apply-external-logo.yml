name: Aplicar logo TBM externa
on:
  push:
    paths:
      - 'LOGO_URL_TRIGGER.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/apply_external_logo.py
      - name: Validar JavaScript
        run: |
          node --check integracao-modulos.js
          node --check global-pdf-preview.js
          node --check service-worker.js
          node --check sw.js
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integracao-modulos.js global-pdf-preview.js service-worker.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Integra logo oficial TBM via fetch e Base64"
          git push
