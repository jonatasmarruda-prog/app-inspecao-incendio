name: Corrigir menu duplicado
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir menu duplicado
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sst-modulos.js')
          s = p.read_text(encoding='utf-8')
          old = "window.addEventListener('DOMContentLoaded',()=>{menu();setTimeout(menu,700)});"
          if old not in s:
              raise SystemExit('Padrão do menu duplicado não encontrado')
          p.write_text(s.replace(old, "window.addEventListener('DOMContentLoaded',()=>{});"), encoding='utf-8')
          PY
      - name: Remover workflow temporário
        run: rm -f .github/workflows/fix-duplicated-menu.yml
      - name: Commit e publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sst-modulos.js .github/workflows/fix-duplicated-menu.yml
          git commit -m 'Corrige menu de inspeções duplicado'
          git push
