name: Corrigir runtime PT
on:
  push:
    paths:
      - 'FIX_PT_RUNTIME_TRIGGER.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar abertura e fechamento da PT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pt=Path('pt-altura.js')
          s=pt.read_text(encoding='utf-8')

          if 'function openPTAltura(data)' not in s:
              marker="async function imageToDataUrl(src){"
              if marker not in s:
                  raise SystemExit('Marcador para restaurar openPTAltura não encontrado')
              block="""function openPTAltura(data){
  injectStyle();
  const overlay=ensureOverlay();
  ptState=normalizeState(data||freshState());
  if(!overlay)throw new Error('Container da Permissão de Trabalho indisponível.');
  overlay.classList.remove('hidden');
  document.body.style.overflow='hidden';
  renderPT();
  return ptState;
}
function closePTAltura(){
  if(ptState)savePT(false,false).catch(()=>{});
  const overlay=$('ptAlturaOverlay');
  if(overlay)overlay.classList.add('hidden');
  document.body.style.overflow='';
}

"""
              s=s.replace(marker,block+marker,1)

          # Solid Badges nativos da PT: fundo sólido + fonte branca.
          s=s.replace(".pt-check-actions .ok{background:#dcfce7!important;color:#166534!important}.pt-check-actions .no{background:#fee2e2!important;color:#991b1b!important}.pt-check-actions .na{background:#e2e8f0!important;color:#334155!important}",
                      ".pt-check-actions .ok{background:#198754!important;color:#ffffff!important}.pt-check-actions .no{background:#dc3545!important;color:#ffffff!important}.pt-check-actions .na{background:#6c757d!important;color:#ffffff!important}")

          # Logo da PT usa prioritariamente o carregador oficial por URL; fallback local permanece.
          old="const logo=window.logoTBM||await imageToDataUrl(LOGO);const emitido=new Date().toLocaleString('pt-BR');\n  const content=[{image:logo,width:100,alignment:'center',margin:[0,0,0,10]}];"
          new="let logo='';\n  try{if(typeof window.carregarLogo==='function')logo=await window.carregarLogo(window.LOGO_TBM_URL)}catch(err){console.warn('[PT LOGO]',err)}\n  if(!logo)logo=window.logoTBM||await imageToDataUrl(LOGO);\n  const emitido=new Date().toLocaleString('pt-BR');\n  const content=[{image:logo,width:100,alignment:'center',margin:[0,0,0,10]}];"
          if old in s:
              s=s.replace(old,new,1)

          s=s.replace("window.__tbmPTAlturaVersion='2026.09.08.pt-altura.6-email-on-save';",
                      "window.__tbmPTAlturaVersion='2026.09.08.pt-altura.8-runtime-restored';")
          pt.write_text(s,encoding='utf-8')

          # Loader: versão nova e diagnóstico explícito.
          loader=Path('sst-repair-loader.js')
          l=loader.read_text(encoding='utf-8')
          l=l.replace("./pt-altura.js?v=20260908-07&cb=", "./pt-altura.js?v=20260908-08&cb=")
          l=l.replace("s.onerror=()=>resolve(false)", "s.onerror=e=>{console.error('[PT LOAD] Falha ao carregar pt-altura.js',e);resolve(false)}")
          loader.write_text(l,encoding='utf-8')

          # Cache bust também no HTML principal para impedir loader antigo em clientes já abertos.
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('./sst-repair-loader.js?v=20260903-23','./sst-repair-loader.js?v=20260908-08')
          index.write_text(html,encoding='utf-8')

          # PWA v89.
          for name in ('service-worker.js','sw.js'):
              p=Path(name); x=p.read_text(encoding='utf-8')
              x=x.replace('inspecao-sst-v88','inspecao-sst-v89').replace('?v=88','?v=89')
              p.write_text(x,encoding='utf-8')
          PY
      - name: Validar PT restaurada
        run: |
          node --check pt-altura.js
          node --check sst-repair-loader.js
          node --check service-worker.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          pt=Path('pt-altura.js').read_text(encoding='utf-8')
          loader=Path('sst-repair-loader.js').read_text(encoding='utf-8')
          hist=Path('local-history.js').read_text(encoding='utf-8')
          assert 'function openPTAltura(data)' in pt
          assert 'function closePTAltura()' in pt
          assert 'window.openPTAltura=openPTAltura' in pt
          assert 'window.makePTAlturaPdf=makePTPdf' in pt
          assert "groupHTML('escadas'" in pt
          assert "groupHTML('andaimes'" in pt
          assert "groupHTML('pta'" in pt
          assert 'preventiveMeasures' in pt
          assert '#198754' in pt and '#dc3545' in pt and '#6c757d' in pt and '#ffffff' in pt
          assert 'window.carregarLogo' in pt and 'window.LOGO_TBM_URL' in pt
          assert "collection('inspections')" not in pt
          assert "const COLLECTION='relatorios_sst'" in hist
          assert 'localStorage.setItem' not in pt and 'localStorage.getItem' not in pt
          assert 'pt-altura.js?v=20260908-08' in loader
          assert 'inspecao-sst-v89' in Path('service-worker.js').read_text(encoding='utf-8')
          print('PT_RUNTIME_OK')
          PY
      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pt-altura.js sst-repair-loader.js index.html service-worker.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restaura runtime completo da Permissão de Trabalho'
          git pull --rebase origin main
          git push origin main
