name: Auditoria e limpeza SST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: "!contains(github.event.head_commit.message, '[sst-clean]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpar HTML acidental do módulo SST
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sst-modulos.js'); s=p.read_text(encoding='utf-8')
          marker='<script id="tbm-cnpj-reports">'
          if marker in s: s=s.split(marker,1)[0].rstrip()+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar sintaxe de todos os módulos
        run: |
          set -e
          for f in sst-modulos.js offline-boot.js sst-repair-loader.js compartilhar-relatorio.js editar-relatorio.js abnt-relatorio.js integracao-modulos.js sw.js service-worker.js; do echo "OK $f"; node --check "$f"; done
      - name: Validar index e pontos de entrada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          for x in ['id="start"','id="startSafety"','id="startMachine"','id="startEpi"','id="startAccident"','id="startReport"','sst-modulos.js','offline-boot.js']:
              assert x in h, x
          print('INDEX OK')
          PY
      - name: Commit limpeza se necessária
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sst-modulos.js
          git diff --cached --quiet || git commit -m 'Limpa módulo SST e restaura sintaxe [sst-clean]'
          git push
