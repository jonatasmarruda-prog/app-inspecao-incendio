name: Corrigir coleção Firestore SST
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-diagnostic-temp.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrar app para coleção autorizada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ("const CLOUD_COLLECTION='relatorios_sst',APP_VERSION='2026.09.08.cloud-first.1';",
                   "const CLOUD_COLLECTION='inspections',APP_VERSION='2026.09.08.cloud-first.2-inspections';"),
              ],
              'local-history.js': [
                  ("const COLLECTION='relatorios_sst';", "const COLLECTION='inspections';"),
                  ("clean.appVersion='2026.09.08.cloud-history.1';", "clean.appVersion='2026.09.08.cloud-history.2-inspections';"),
                  ("window.__tbmCloudHistoryVersion='2026.09.08.1-realtime-firestore';", "window.__tbmCloudHistoryVersion='2026.09.08.2-inspections';"),
              ],
              'service-worker.js': [
                  ("const CACHE='inspecao-sst-v88';", "const CACHE='inspecao-sst-v89';"),
                  ("url+'?v=88'", "url+'?v=89'"),
              ],
              'sw.js': [
                  ("const CACHE='inspecao-sst-v88';", "const CACHE='inspecao-sst-v89';"),
                  ("url+'?v=88'", "url+'?v=89'"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'MARCADOR_NAO_ENCONTRADO:{filename}:{old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('ATUALIZADO', filename)
          PY

          grep -q "CLOUD_COLLECTION='inspections'" index.html
          grep -q "const COLLECTION='inspections'" local-history.js
          grep -q "inspecao-sst-v89" service-worker.js
          grep -q "inspecao-sst-v89" sw.js
          node --check local-history.js
          node --check service-worker.js
          node --check sw.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html local-history.js service-worker.js sw.js
          git commit -m 'Restaura nuvem SST na coleção Firestore autorizada'
          git push origin HEAD:main
