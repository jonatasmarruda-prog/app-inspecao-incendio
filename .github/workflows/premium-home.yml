name: Atualizar tela inicial premium

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar tela inicial premium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="premium-home-css">
          .premium-home{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#f8fafc);border-radius:28px;padding:28px 22px;box-shadow:0 18px 50px #0f172a18;border:1px solid #ffffff}
          .premium-home:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#dc26261a;right:-90px;top:-90px}
          .premium-home:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#0f172a0b;left:-90px;bottom:-100px}
          .welcome{position:relative;z-index:1;text-align:center}.welcome-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:12px;font-weight:900;letter-spacing:.4px}.welcome h1{font-size:30px;line-height:1.08;margin:15px 0 7px;background:linear-gradient(135deg,#7f1d1d,#dc2626);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{margin:0;color:#64748b;font-size:14px}.today-card{margin:20px 0;padding:15px;border-radius:18px;background:#111827;color:#fff;text-align:center;box-shadow:0 10px 25px #11182724}.today-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}.today-date{font-size:19px;font-weight:900;margin-top:4px}.today-time{font-size:12px;opacity:.7;margin-top:3px}.choice-title{position:relative;z-index:1;text-align:left;font-size:17px;font-weight:900;margin:22px 0 10px}.inspection-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:11px}.inspection-tile{min-height:125px;border-radius:19px;color:#fff;text-align:left;padding:17px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px #0f172a20;transition:transform .15s ease,filter .15s ease}.inspection-tile:active{transform:scale(.98);filter:brightness(.95)}.inspection-tile .ico{font-size:31px}.inspection-tile strong{font-size:15px;line-height:1.1}.inspection-tile span{font-size:10px;opacity:.78;margin-top:4px}.fire{background:linear-gradient(145deg,#991b1b,#ef4444)}.safety{background:linear-gradient(145deg,#0f172a,#334155)}.machine{background:linear-gradient(145deg,#1d4ed8,#60a5fa)}.epi{background:linear-gradient(145deg,#047857,#34d399)}.accident{background:linear-gradient(145deg,#92400e,#f59e0b)}.reporttile{background:linear-gradient(145deg,#581c87,#a855f7)}.historytile{background:linear-gradient(145deg,#334155,#64748b)}.premium-status{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;color:#64748b;font-size:11px}.premium-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e20}.premium-history{position:relative;z-index:1;margin-top:12px;width:100%;background:#e2e8f0;color:#0f172a}.premium-home .notice{margin:0 0 14px}
          @media(max-width:650px){.premium-home{padding:23px 16px;border-radius:25px}.welcome h1{font-size:27px}.inspection-grid{gap:9px}.inspection-tile{min-height:116px;padding:14px}.inspection-tile .ico{font-size:28px}.inspection-tile strong{font-size:14px}}
          </style>'''
          if 'id="premium-home-css"' not in s:
              s=s.replace('</style></head>', '</style>'+css+'</head>',1)
          home='''<section id="home"><div class="premium-home"><div class="welcome"><div class="welcome-badge">🛡️ SISTEMA PROFISSIONAL DE SST</div><h1>Bem-vindo!</h1><p>Selecione abaixo o tipo de inspeção que deseja realizar.</p></div><div class="today-card"><div class="today-label">Hoje</div><div id="premiumToday" class="today-date">--</div><div id="premiumTime" class="today-time">--</div></div><div class="choice-title">Qual inspeção você deseja fazer?</div><div class="inspection-grid"><button id="start" class="inspection-tile fire" type="button"><div class="ico">🧯</div><div><strong>Combate a Incêndio</strong><span>Extintores e hidrantes</span></div></button><button id="startSafety" class="inspection-tile safety" type="button"><div class="ico">🦺</div><div><strong>Inspeção de Segurança</strong><span>Condições e irregularidades</span></div></button><button id="startMachine" class="inspection-tile machine" type="button"><div class="ico">⚙️</div><div><strong>Máquinas e Equipamentos</strong><span>Checklist NR-12</span></div></button><button id="startEpi" class="inspection-tile epi" type="button"><div class="ico">🧤</div><div><strong>Inspeção de EPI</strong><span>Controle e conformidade</span></div></button><button id="startAccident" class="inspection-tile accident" type="button"><div class="ico">⚠️</div><div><strong>Investigação de Acidente</strong><span>Registro e causas</span></div></button><button id="startReport" class="inspection-tile reporttile" type="button"><div class="ico">📋</div><div><strong>Relatório de Inspeção</strong><span>Irregularidade e melhoria</span></div></button></div><button id="hist" class="btn premium-history" type="button">📚 Histórico de inspeções</button><div class="premium-status"><span class="premium-dot"></span> Dados salvos automaticamente • Funciona offline</div></div></section>'''
          s=re.sub(r'<section id="home">.*?</section>', home, s, count=1, flags=re.S)
          marker="function newInspection()"
          inject='''function updatePremiumClock(){const n=new Date();const d=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});const t=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});const a=document.getElementById('premiumToday'),b=document.getElementById('premiumTime');if(a)a.textContent=d.charAt(0).toUpperCase()+d.slice(1);if(b)b.textContent=t+' • '+(navigator.onLine?'Online':'Offline')}setInterval(updatePremiumClock,1000);updatePremiumClock();
          document.addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(id==='startSafety'||id==='startMachine'||id==='startEpi'||id==='startAccident'||id==='startReport'){if(typeof window.openSSTModule==='function'){window.openSSTModule(id.replace('start','').toLowerCase())}else{alert('Módulo carregando. Tente novamente em instantes.')}}});
          '''
          if marker in s and 'updatePremiumClock' not in s:
              s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Criar tela inicial premium com seleção de inspeções"
          git push