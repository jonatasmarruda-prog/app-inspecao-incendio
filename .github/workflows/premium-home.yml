name: Atualizar tela inicial premium

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar tela inicial premium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="premium-home-css">
          .premium-home{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 0%,#fecaca 0,#fff 28%,#f8fafc 72%);border-radius:30px;padding:30px 22px;box-shadow:0 22px 60px #0f172a20;border:1px solid #fff}
          .premium-home:before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:linear-gradient(135deg,#ef444426,#7f1d1d08);right:-130px;top:-150px;filter:blur(2px)}
          .premium-home:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#0f172a08;left:-120px;bottom:-120px}
          .welcome{position:relative;z-index:1;text-align:center}.welcome-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:linear-gradient(145deg,#fff,#fee2e2);color:#991b1b;font-size:11px;font-weight:950;letter-spacing:.8px;box-shadow:0 7px 18px #991b1b16;border:1px solid #fecaca}.welcome h1{font-size:32px;line-height:1.05;margin:16px 0 7px;background:linear-gradient(135deg,#450a0a,#dc2626 60%,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}.welcome p{margin:0;color:#64748b;font-size:14px}.today-card{position:relative;z-index:1;margin:21px 0;padding:16px;border-radius:20px;background:linear-gradient(145deg,#0b1220,#1f2937);color:#fff;text-align:center;box-shadow:inset 0 1px #ffffff20,0 14px 30px #0f172a25;border:1px solid #ffffff12}.today-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;opacity:.62}.today-date{font-size:19px;font-weight:900;margin-top:5px}.today-time{font-size:12px;opacity:.7;margin-top:4px}.choice-title{position:relative;z-index:1;text-align:left;font-size:18px;font-weight:950;margin:23px 0 11px;letter-spacing:-.3px}.inspection-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.inspection-tile{position:relative;overflow:hidden;min-height:137px;border-radius:22px;color:#fff;text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 28px #0f172a25,inset 0 1px #ffffff55;border:1px solid #ffffff30;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}.inspection-tile:before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-35px;top:-35px;background:#ffffff18;filter:blur(1px)}.inspection-tile:after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:18px;border-radius:50%;background:#00000018;filter:blur(8px)}.inspection-tile:active{transform:translateY(2px) scale(.985);filter:brightness(.96);box-shadow:0 7px 15px #0f172a25}.icon3d{position:relative;z-index:2;width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:29px;background:linear-gradient(145deg,#ffffff55,#ffffff12);box-shadow:inset 0 2px 2px #ffffff66,0 7px 12px #00000022;border:1px solid #ffffff45;text-shadow:0 3px 4px #0005;transform:perspective(120px) rotateX(4deg)}.inspection-tile strong,.inspection-tile span{position:relative;z-index:2}.inspection-tile strong{font-size:15px;line-height:1.1;text-shadow:0 2px 4px #0004}.inspection-tile span{font-size:10px;opacity:.82;margin-top:4px}.fire{background:linear-gradient(145deg,#7f1d1d,#dc2626 55%,#fb7185)}.safety{background:linear-gradient(145deg,#020617,#334155 65%,#64748b)}.machine{background:linear-gradient(145deg,#172554,#2563eb 60%,#60a5fa)}.epi{background:linear-gradient(145deg,#064e3b,#059669 60%,#34d399)}.accident{background:linear-gradient(145deg,#78350f,#d97706 60%,#fbbf24)}.reporttile{background:linear-gradient(145deg,#3b0764,#7e22ce 60%,#c084fc)}.premium-status{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:17px;color:#64748b;font-size:11px}.premium-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e20,0 0 12px #22c55e80}.premium-history{position:relative;z-index:1;margin-top:12px;width:100%;background:linear-gradient(145deg,#e2e8f0,#fff);color:#0f172a;border:1px solid #cbd5e1;box-shadow:0 8px 18px #0f172a12}.premium-home .notice{margin:0 0 14px}
          @media(max-width:650px){.premium-home{padding:24px 16px;border-radius:27px}.welcome h1{font-size:29px}.inspection-grid{gap:9px}.inspection-tile{min-height:125px;padding:14px;border-radius:19px}.inspection-tile .icon3d{width:49px;height:49px;font-size:27px}.inspection-tile strong{font-size:14px}}
          </style>'''
          if 'id="premium-home-css"' not in s:
              s=s.replace('</style></head>', '</style>'+css+'</head>',1)
          home='''<section id="home"><div class="premium-home"><div class="welcome"><div class="welcome-badge">🛡️ SISTEMA PROFISSIONAL DE SST</div><h1>Bem-vindo!</h1><p>Selecione abaixo o tipo de inspeção que deseja realizar.</p></div><div class="today-card"><div class="today-label">Hoje</div><div id="premiumToday" class="today-date">--</div><div id="premiumTime" class="today-time">--</div></div><div class="choice-title">Qual inspeção você deseja fazer?</div><div class="inspection-grid"><button id="start" class="inspection-tile fire" type="button"><div class="icon3d">🧯</div><div><strong>Combate a Incêndio</strong><span>Extintores e hidrantes</span></div></button><button id="startSafety" class="inspection-tile safety" type="button"><div class="icon3d">🦺</div><div><strong>Inspeção de Segurança</strong><span>Condições e irregularidades</span></div></button><button id="startMachine" class="inspection-tile machine" type="button"><div class="icon3d">⚙️</div><div><strong>Máquinas e Equipamentos</strong><span>Checklist NR-12</span></div></button><button id="startEpi" class="inspection-tile epi" type="button"><div class="icon3d">🧤</div><div><strong>Inspeção de EPI</strong><span>Controle e conformidade</span></div></button><button id="startAccident" class="inspection-tile accident" type="button"><div class="icon3d">⚠️</div><div><strong>Investigação de Acidente</strong><span>Registro e causas</span></div></button><button id="startReport" class="inspection-tile reporttile" type="button"><div class="icon3d">📋</div><div><strong>Relatório de Inspeção</strong><span>Irregularidade e melhoria</span></div></button></div><button id="hist" class="btn premium-history" type="button">📚 Histórico de inspeções</button><div class="premium-status"><span class="premium-dot"></span> Dados salvos automaticamente • Funciona offline</div></div></section>'''
          s=re.sub(r'<section id="home">.*?</section>', home, s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Elevar tela inicial com icones premium 3D"
          git push