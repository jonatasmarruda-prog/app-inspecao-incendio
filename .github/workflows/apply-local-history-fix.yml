name: Corrigir envio de email da PT
on:
  push:
    paths:
      - 'APPLY_LOCAL_HISTORY_FIX.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python3 scripts/apply_local_history_fix.py
      - name: Validar sintaxe e gatilho de email
        run: |
          node --check pt-altura.js
          node --check email-relatorio-auto.js
          node --check local-history.js
          python3 - <<'PY'
          from pathlib import Path
          pt=Path('pt-altura.js').read_text(encoding='utf-8')
          loader=Path('sst-repair-loader.js').read_text(encoding='utf-8')
          hist=Path('local-history.js').read_text(encoding='utf-8')
          assert "tbmAutoEmailSavedReport({mode:'pt'})" in pt
          assert 'await loadAutoEmailReport();' in loader
          assert "localStorage.setItem(EMAIL_ENABLE_KEY,'1')" in hist
          print('PT_EMAIL_OK')
          PY
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige envio automatico de email ao salvar PT'
          git push
