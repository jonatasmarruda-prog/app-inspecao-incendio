name: Ativar PWA SST Inspeções

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          code='<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}));}</script>'
          if 'navigator.serviceWorker.register' not in s:
              s=s.replace('</body>',code+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Ativar PWA e service worker"
          git push